plugins {
    id 'com.android.application'
}

// The native code is built by tools\android_build.ps1 (CMake + the NDK), which
// stages the libraries into build-android\apk-libs. Gradle only packages them:
// driving 1,000 generated C files through Gradle's CMake integration adds nothing.
def buildAndroid = new File(rootProject.projectDir, "../build-android")

android {
    namespace 'io.github.bearfeet0511.stadiumrecomp'
    compileSdk 34
    ndkVersion '27.1.12297006'

    defaultConfig {
        applicationId "io.github.bearfeet0511.stadiumrecomp"
        // aligned_alloc in Bionic needs API 28. Vulkan 1.1+ handhelds are well above it.
        minSdk 28
        targetSdk 34
        // versionCode must go up with every Android release: the launcher's update
        // check compares it with the number at the end of the release's APK name.
        versionCode 4
        versionName "0.2.0-beta3"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Release signing. Every release must be signed with this ONE key: Android
    // only installs an update over an app signed with the same key, and the
    // alternative (uninstall first) deletes the app folder with everyone's saves.
    // The keystore and its passwords stay outside the repo, in the builder's own
    // ~/.gradle/gradle.properties:
    //   STADIUM_RELEASE_STORE=C:/Users/<you>/.android/stadiumrecomp-release.jks
    //   STADIUM_RELEASE_STORE_PASSWORD=...
    //   STADIUM_RELEASE_KEY_ALIAS=stadiumrecomp
    //   STADIUM_RELEASE_KEY_PASSWORD=...
    signingConfigs {
        release {
            if (project.hasProperty('STADIUM_RELEASE_STORE')) {
                storeFile file(STADIUM_RELEASE_STORE)
                storePassword STADIUM_RELEASE_STORE_PASSWORD
                keyAlias STADIUM_RELEASE_KEY_ALIAS
                keyPassword STADIUM_RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        // Test builds use the release key too, so a tester's install can always be
        // updated by a release (and the other way round) without uninstalling.
        debug {
            if (project.hasProperty('STADIUM_RELEASE_STORE')) signingConfig signingConfigs.release
        }
        release {
            // Native code is built and stripped by tools\android_build.ps1.
            minifyEnabled false
            signingConfig project.hasProperty('STADIUM_RELEASE_STORE') ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [new File(buildAndroid, "apk-libs")]
            // SDL's Java half comes from the same checkout as its native half.
            java.srcDirs += new File(buildAndroid, "_deps/sdl2-src/android-project/app/src/main/java")
        }
    }
}
